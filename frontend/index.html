<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Менеджер задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<script>
console.log('API_BASE:', 'http://127.0.0.1:8000/api');
fetch('http://127.0.0.1:8000/api/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: 'test', password: 'test123'})
})
.then(r => r.json())
.then(d => console.log('Response:', d))
.catch(e => console.error('Error:', e));
</script>
<body>
    <div id="app">
        <!-- Шапка -->
        <header>
            <h1>📋 TaskFlow</h1>
            <div id="user-info" style="display:none;">
                <span id="username-display"></span>
                <button id="logout-btn">Выйти</button>
            </div>
        </header>

        <main>
            <div id="auth-page">
                <div class="auth-container">
                    <h2 id="auth-title">Вход</h2>
                    
                    <form id="auth-form">
                        <input type="text" id="auth-username" placeholder="Имя пользователя" required>
                        <input type="password" id="auth-password" placeholder="Пароль" required>
                        <button type="submit" id="auth-submit">Войти</button>
                    </form>
                    
                    <p id="auth-toggle">
                        <span id="toggle-text">Нет аккаунта?</span>
                        <a href="#" id="toggle-link">Зарегистрироваться</a>
                    </p>
                    
                    <div id="auth-error" class="error-message"></div>
                </div>
            </div>

            <div id="tasks-page" style="display:none;">
                <div class="task-controls">
                    <form id="task-form">
                        <input type="text" id="task-input" placeholder="Что нужно сделать?" required>
                        <button type="submit">Добавить</button>
                    </form>
                    
                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">Все</button>
                        <button class="filter-btn" data-filter="active">Активные</button>
                        <button class="filter-btn" data-filter="completed">Выполненные</button>
                    </div>
                </div>

                <div class="task-stats">
                    <span>Осталось: <strong id="remaining-count">0</strong></span>
                    <span>Всего: <strong id="total-count">0</strong></span>
                </div>

                <ul id="task-list"></ul>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
